<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>등반 조작 실험실</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}canvas{display:block;touch-action:none;cursor:none}</style>
</head><body>
<script>
// 공통 엔진: 960x540 논리 해상도, 고정 스텝 120Hz, 키·마우스·터치, 효과음, 자동 시연 훅
'use strict';
const G = (() => {
  const W = 960, H = 540, STEP = 1 / 120;
  const FONT = '"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","WenQuanYi Zen Hei",sans-serif';
  const canvas = document.createElement('canvas');
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  let scale = 1, offX = 0, offY = 0, dpr = 1;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    const w = window.innerWidth, h = window.innerHeight;
    scale = Math.min(w / W, h / H);
    offX = (w - W * scale) / 2; offY = (h - H * scale) / 2;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  }
  window.addEventListener('resize', resize); resize();

  const params = new URLSearchParams(location.search);
  const auto = params.get('auto');

  // ---- 입력
  const real = { keys: {}, action: false };
  const virt = { keys: {}, action: false };
  const edge = { pressed: {}, released: {}, aPress: false, aRelease: false, clicks: [] };
  const mouse = { x: W / 2, y: H / 2, down: [false, false, false] };
  let oneButton = false;
  const actionKeys = ['Space'];
  function keyDown(code) { edge.pressed[code] = true; if (actionKeys.includes(code)) edge.aPress = true; }
  function keyUp(code) { edge.released[code] = true; if (actionKeys.includes(code)) edge.aRelease = true; }
  window.addEventListener('keydown', e => {
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
    unlockAudio(); paused = false;
    if (e.repeat || auto) return;
    real.keys[e.code] = true; keyDown(e.code);
  });
  window.addEventListener('keyup', e => { if (auto) return; real.keys[e.code] = false; keyUp(e.code); });
  function toLogical(cx, cy) { return { x: (cx - offX) / scale, y: (cy - offY) / scale }; }
  window.addEventListener('contextmenu', e => e.preventDefault());
  // 마우스 버튼: 이벤트 종류가 아니라 매 이벤트의 buttons 값(지금 눌린 버튼 전체)으로 맞춘다.
  // 한 버튼을 누른 채 다른 버튼을 누르거나 떼면 브라우저는 pointerdown/up이 아니라 pointermove로 알려 주기 때문이다.
  let guard = false; // 포커스를 잃었다 돌아온 뒤에는 버튼을 모두 뗀 것이 확인될 때까지 누름을 듣지 않는다
  function setBtn(btn, on) {
    if (mouse.down[btn] === on) return;
    mouse.down[btn] = on;
    if (on) edge.clicks.push({ x: mouse.x, y: mouse.y, button: btn });
  }
  function syncMouse(e) {
    if (auto || (e.pointerType && e.pointerType !== 'mouse')) return;
    const p = toLogical(e.clientX, e.clientY); mouse.x = p.x; mouse.y = p.y;
    const b = e.buttons;
    if (guard) { if (b === 0) guard = false; else return; }
    setBtn(0, !!(b & 1)); setBtn(2, !!(b & 2)); setBtn(1, !!(b & 4));
  }
  for (const t of ['pointerdown', 'pointermove', 'pointerup', 'pointercancel', 'mousedown', 'mouseup', 'mousemove', 'mouseenter'])
    window.addEventListener(t, e => {
      if (t === 'pointerdown') { unlockAudio(); try { canvas.setPointerCapture(e.pointerId); } catch (err) {} } // 창 밖에서 떼도 알 수 있게
      if (t.startsWith('pointer') || t === 'mousedown') e.preventDefault();
      syncMouse(e);
    }, { passive: false });
  function dropAll() { // 포커스를 잃으면 누르고 있던 것을 모두 뗀 것으로 본다(잡고 있는 손은 영향 없음)
    for (const k in real.keys) if (real.keys[k]) { real.keys[k] = false; keyUp(k); }
    setBtn(0, false); setBtn(1, false); setBtn(2, false);
  }
  let paused = false;
  window.addEventListener('blur', () => { if (auto) return; dropAll(); guard = true; paused = true; });
  window.addEventListener('focus', () => { paused = false; });
  document.addEventListener('visibilitychange', () => { if (document.hidden && !auto) { dropAll(); guard = true; paused = true; } });
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  const input = {
    key: c => !!(real.keys[c] || virt.keys[c]),
    pressed: c => !!edge.pressed[c],
    released: c => !!edge.released[c],
    get action() { return real.action || virt.action || !!real.keys.Space || !!virt.keys.Space; },
    get actionPressed() { return edge.aPress; },
    get actionReleased() { return edge.aRelease; },
    get clicks() { return edge.clicks; },
    mouse,
    any() { return edge.aPress || Object.keys(edge.pressed).length > 0 || edge.clicks.length > 0; },
  };
  // 자동 시연용 가상 입력
  const bot = {
    key(code, on) { if (!!virt.keys[code] === on) return; virt.keys[code] = on; on ? keyDown(code) : keyUp(code); },
    action(on) { if (virt.action === on) return; virt.action = on; on ? edge.aPress = true : edge.aRelease = true; },
    tap(code) { keyDown(code); keyUp(code); },
    move(x, y) { mouse.x = x; mouse.y = y; },
    click(x, y, button = 0) { mouse.x = x; mouse.y = y; edge.clicks.push({ x, y, button }); },
  };

  // ---- 소리
  let ac = null;
  function unlockAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
  }
  function tone(freq, dur, type = 'square', vol = 0.12, slide = 0) {
    if (!ac) return;
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol = 0.15, hp = 800) {
    if (!ac) return;
    const t = ac.currentTime, n = Math.floor(ac.sampleRate * dur), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = b; f.type = 'highpass'; f.frequency.value = hp; g.gain.value = vol;
    s.connect(f).connect(g).connect(ac.destination); s.start(t);
  }
  const sfx = {
    snap() { tone(1800, 0.05, 'square', 0.15); tone(900, 0.06, 'triangle', 0.12); },
    grab() { tone(660, 0.07, 'triangle', 0.18); },
    thud() { tone(120, 0.18, 'sine', 0.3, -60); },
    whoosh() { noise(0.35, 0.10, 1200); },
    fail() { tone(220, 0.25, 'sawtooth', 0.12, -120); },
    win() { tone(523, 0.1, 'triangle', 0.15); setTimeout(() => tone(784, 0.18, 'triangle', 0.15), 110); },
    beep() { tone(1200, 0.06, 'square', 0.08); },
    warn() { tone(880, 0.08, 'square', 0.1); },
    miss() { tone(300, 0.08, 'triangle', 0.12, -100); },
  };

  // ---- 그리기 도구
  function text(s, x, y, o = {}) {
    ctx.font = `${o.weight || 600} ${o.size || 16}px ${FONT}`;
    ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'alphabetic';
    if (o.stroke) { ctx.lineWidth = o.strokeW || 4; ctx.strokeStyle = o.stroke; ctx.strokeText(s, x, y); }
    ctx.fillStyle = o.color || '#f2f2ee'; ctx.fillText(s, x, y);
  }
  function textW(s, size = 16, weight = 600) { ctx.font = `${weight} ${size}px ${FONT}`; return ctx.measureText(s).width; }
  function panel(x, y, w, h, fill = 'rgba(10,12,16,0.82)', stroke = null) {
    ctx.fillStyle = fill; roundRect(x, y, w, h, 8); ctx.fill();
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function circle(x, y, r, fill, stroke, lw = 2) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  }
  function line(x1, y1, x2, y2, color, lw = 2, dash = null) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = color; ctx.lineWidth = lw;
    if (dash) ctx.setLineDash(dash); ctx.stroke(); if (dash) ctx.setLineDash([]);
  }
  // 상단 안내(최대 두 줄)와 제목, 하단 버전
  function header(title, l1, l2) {
    text(title, 16, 28, { size: 18, weight: 800 });
    if (l1) text(l1, 16, 50, { size: 13, color: 'rgba(240,240,235,0.78)', weight: 500 });
    if (l2) text(l2, 16, 68, { size: 13, color: 'rgba(240,240,235,0.78)', weight: 500 });
    text('v0.1 · R 다시', W - 12, H - 10, { size: 11, align: 'right', color: 'rgba(255,255,255,0.4)', weight: 500 });
  }
  // 결과 띠: 실패 원인 / 성공
  function banner(main, sub, kind = 'fail', y = 86) {
    const col = kind === 'fail' ? 'rgba(150,28,28,0.92)' : kind === 'win' ? 'rgba(24,110,60,0.92)' : 'rgba(30,40,70,0.92)';
    const w = Math.max(textW(main, 24, 800), textW(sub || '', 15, 500)) + 60;
    panel(W / 2 - w / 2, y, w, sub ? 74 : 48, col);
    text(main, W / 2, y + 34, { size: 24, weight: 800, align: 'center' });
    if (sub) text(sub, W / 2, y + 60, { size: 15, weight: 500, align: 'center', color: 'rgba(255,255,255,0.9)' });
  }

  let shakeT = 0, shakeA = 0, flashT = 0, flashCol = '#fff';
  function shake(a = 6, t = 0.25) { shakeA = a; shakeT = t; }
  function flash(col = 'rgba(255,60,60,0.35)', t = 0.25) { flashCol = col; flashT = t; }

  // ---- 루프
  let game = null, acc = 0, last = 0, simTime = 0;
  function frame(ts) {
    const dt = Math.min(0.1, (ts - last) / 1000 || 0); last = ts; acc += dt;
    if (paused) acc = 0;
    while (acc >= STEP) {
      if (game.bot && auto) game.bot(STEP, bot, auto);
      game.update(STEP, input);
      simTime += STEP; acc -= STEP;
      edge.pressed = {}; edge.released = {}; edge.aPress = false; edge.aRelease = false; edge.clicks = [];
      if (shakeT > 0) shakeT -= STEP; if (flashT > 0) flashT -= STEP;
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    let sx = 0, sy = 0;
    if (shakeT > 0) { sx = (Math.random() - 0.5) * shakeA * 2; sy = (Math.random() - 0.5) * shakeA * 2; }
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, (offX + sx * scale) * dpr, (offY + sy * scale) * dpr);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
    game.draw(ctx);
    if (flashT > 0) { ctx.globalAlpha = Math.min(1, flashT * 4); ctx.fillStyle = flashCol; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
    if (paused) { ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H); banner('일시정지', '창을 클릭하거나 키를 누르면 이어서 — 잡고 있던 손발은 그대로', 'info', 220); }
    ctx.restore();
    requestAnimationFrame(frame);
  }
  function run(g, opts = {}) {
    game = g; oneButton = !!opts.oneButton;
    document.title = opts.title || document.title;
    g.init && g.init();
    requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
  }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
  return { W, H, ctx, input, bot, sfx, text, textW, panel, roundRect, circle, line, header, banner, shake, flash, run, auto, params, clamp, lerp, dist, get time() { return simTime; } };
})();

</script>
<script>
// 등반 조작 실험실 · 물리 계산부 (브라우저·노드 공용, 화면과 무관)
// 몸: 가슴·엉덩이·양손·양발 6개 질점. 몸통은 막대, 팔다리는 최대·최소 길이가 있는 줄 + 근육.
// 근육은 두 질점 사이에 크기 같고 방향 반대인 힘으로만 작용한다(외부에서 끌어 주는 힘 없음).
'use strict';
const PH = (() => {
  const C = {
    G: 1400, T: 54, A: 72, AMIN: 0, L: 84, LMIN: 26,
    MC: 28, MP: 22, MH: 2, MF: 6,
    SUB: 8, ITER: 4, FLOOR: 640, GRAB_R: 14, PLANT_R: 10, PLANT_V: 260, FOOT_R: 5, MU: 1.0,
    COUPLE: 0.15, AIMHOLD: 0, LEG_RANGE: 125, REACT: 0, // 다리가 몸통 아래 방향에서 벗어날 수 있는 각도
  };
  const MASS = C.MC + C.MP + 2 * C.MH + 2 * C.MF, W = MASS * C.G;
  // 힘 한계(체중 W의 배수)와 스프링 값
  const M = {
    armPull: 1.3 * W, armPush: 0.9 * W, armK: 1.3 * W / 3, armC: 2000, armRate: 320,
    legPush: 1.8 * W, legPull: 0, legPress: 0.15 * W, legK: 1.8 * W / 3, legC: 2400, legRate: 750,
    handReach: 0.3 * W, handKp: 0.3 * W / 15, handKd: 110,
    footReach: 0.5 * W, footKp: 0.5 * W / 15, footKd: 250,
    upK: 0.1 * W, upC: 1500, upMax: 1.5 * W,
    freeC: [4, 4, 10, 10],
  };
  const GRIP = { // th: 손이 버티는 방향의 한계각(면을 누르는 방향 기준)
    ledge: { th: 75, name: '턱' }, incut: { th: 105, name: '깊은 턱' },
    jug: { th: 180, all: true, name: '저그' }, sloper: { th: 40, name: '둥근 면' }, block: null,
    rock: { th: 55, all: true, name: '바위 면' }, // 일반 지형: 표시된 홀드가 아니라 면의 방향과 당기는 방향으로만 정해진다
  };

  // ---- 지형
  function poly(id, type, pts, extra = {}) {
    let cx = 0, cy = 0; for (const q of pts) { cx += q[0]; cy += q[1]; } cx /= pts.length; cy /= pts.length;
    const edges = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      let nx = b[1] - a[1], ny = -(b[0] - a[0]); const l = Math.hypot(nx, ny); nx /= l; ny /= l;
      if ((a[0] - cx) * nx + (a[1] - cy) * ny < 0) { nx = -nx; ny = -ny; }
      const g = GRIP[type];
      edges.push({ ax: a[0], ay: a[1], bx: b[0], by: b[1], nx, ny, grip: !!g && (g.all || ny < -0.5) });
    }
    return { id, type, pts, edges, cx, cy, ...extra };
  }
  const rect = (id, type, x, y, w, h, extra) => poly(id, type, [[x, y], [x + w, y], [x + w, y + h], [x, y + h]], extra);
  function makeWorld() {
    const dome = []; for (let a = 200; a <= 340; a += 20) dome.push([400 + 36 * Math.cos(a * Math.PI / 180), 248 + 36 * Math.sin(a * Math.PI / 180)]);
    const hex = []; for (let a = 0; a < 360; a += 60) hex.push([415 + 9 * Math.cos(a * Math.PI / 180), 350 + 9 * Math.sin(a * Math.PI / 180)]);
    return [
      rect('A', 'incut', 180, 300, 150, 16), rect('F1', 'ledge', 258, 468, 56, 40),
      poly('J', 'jug', hex), poly('S', 'sloper', dome),
      rect('B', 'ledge', 470, 345, 140, 16), rect('F3', 'ledge', 510, 455, 40, 10), rect('F4', 'ledge', 474, 520, 44, 10),
      rect('G', 'incut', 520, 252, 110, 16, { goal: true }),
      poly('R', 'rock', [[650, 372], [712, 388], [724, 470], [716, 566], [660, 566], [640, 440]]), // 바위 덩어리: 윗면은 비스듬하고 옆면은 가파르다
      poly('R2', 'rock', [[622, 447], [644, 447], [644, 457], [624, 458]]),                // 바위 옆의 작은 돌출부
      rect('P', 'incut', 770, 300, 90, 16),                                              // 반동 연습용
    ];
  }
  function closestOnSeg(e, x, y) {
    const dx = e.bx - e.ax, dy = e.by - e.ay, t = Math.max(0, Math.min(1, ((x - e.ax) * dx + (y - e.ay) * dy) / (dx * dx + dy * dy)));
    return [e.ax + dx * t, e.ay + dy * t];
  }
  // 원(발)과 볼록 다각형: 밀어낼 방향과 깊이
  function polyPush(pl, x, y, r) {
    let best = -1e9, bi = -1;
    for (let i = 0; i < pl.edges.length; i++) { const e = pl.edges[i], d = (x - e.ax) * e.nx + (y - e.ay) * e.ny; if (d > best) { best = d; bi = i; } }
    if (best > r) return null;
    if (best <= 0) { const e = pl.edges[bi]; return { nx: e.nx, ny: e.ny, depth: r - best }; }
    let dm = 1e9, qx = 0, qy = 0;
    for (const e of pl.edges) { const q = closestOnSeg(e, x, y), d = Math.hypot(x - q[0], y - q[1]); if (d < dm) { dm = d; qx = q[0]; qy = q[1]; } }
    if (dm >= r || dm < 1e-9) return null;
    return { nx: (x - qx) / dm, ny: (y - qy) / dm, depth: r - dm };
  }
  function nearestGrip(world, x, y) {
    let best = null;
    for (const pl of world) for (const e of pl.edges) if (e.grip) {
      const q = closestOnSeg(e, x, y), d = Math.hypot(x - q[0], y - q[1]);
      if (!best || d < best.d) best = { d, x: q[0], y: q[1], nx: e.nx, ny: e.ny, type: pl.type, poly: pl.id };
    }
    return best;
  }
  function nearestSurface(world, x, y) { // 발 디딜 면: 가까운 면 중 위를 향한 면을 조금 우선한다
    let best = null;
    for (const pl of world) for (const e of pl.edges) {
      const q = closestOnSeg(e, x, y), d = Math.hypot(x - q[0], y - q[1]), sc = d + 6 * (1 + e.ny);
      if (!best || sc < best.sc) best = { d, sc, x: q[0], y: q[1], nx: e.nx, ny: e.ny, poly: pl.id };
    }
    return best;
  }

  // ---- 몸
  const pt = (x, y, m) => ({ x, y, px: x, py: y, vx: 0, vy: 0, m, fx: 0, fy: 0 });
  const STATIONS = {
    1: { name: '두 손 매달리기', c: [307, 371], hands: [[296, 300], [318, 300]] },
    2: { name: '한 손 매달리기', c: [322, 372], hands: [null, [322, 300]] },
    3: { name: '발판 위 웅크리기', c: [307, 371], p: [308, 425], hands: [[296, 300], [318, 300]], feet: [[280, 463], [294, 463]] },
    4: { name: '건너편 한 손', c: [476, 417], hands: [[476, 345], null] },
    5: { name: '반동 연습(한 손, 주변 빈 공간)', c: [815, 372], hands: [null, [815, 300]] },
  };
  function create(world, station = 1) {
    const st = typeof station === 'object' ? station : STATIONS[station] || STATIONS[1];
    const c = st.c, hp = st.p || [c[0], c[1] + C.T];
    const s = { world, station, t: 0, dead: false, won: false, winT: 0, pushT: -1, aim: null, wasPower: false, pcx: 0, pcy: 0, events: [], p: [pt(c[0], c[1], C.MC), pt(hp[0], hp[1], C.MP)], limb: [] };
    for (let i = 0; i < 4; i++) {
      const arm = i < 2, root = arm ? 0 : 1, side = i % 2 ? 1 : -1;
      const at = arm ? st.hands[i] : st.feet && st.feet[i - 2];
      const r = s.p[root];

      c.strokeStyle = DARK[i]; c.lineWidth = lb.arm ? 7 : 9; c.lineCap = 'round'; c.lineJoin = 'round'; c.globalAlpha = lb.mode === 'free' ? 0.65 : 1; c.stroke(); c.globalAlpha = 1;
      if (i === 3) { G.line(hp.x, hp.y, ch.x, ch.y, '#3b3f46', 20); c.lineCap = 'round'; G.circle(ch.x + ux * 20, ch.y + uy * 20, 10, '#3b3f46'); }
    }
    for (let i = 0; i < 4; i++) {
      const lb = S.limb[i], e = p[lb.end], on = lb.mode === 'grip' || lb.mode === 'plant';
      c.beginPath();
      if (lb.arm) G.roundRect(e.x - 9, e.y - 9, 18, 18, 6); else c.ellipse(e.x, e.y, 12, 7, 0, 0, Math.PI * 2);
      c.fillStyle = lb.mode === 'free' ? 'rgba(255,255,255,0.55)' : COL[i]; c.fill();
      let ring = on ? '#fff' : 'rgba(0,0,0,0.6)';
      if (lb.mode === 'grip' && Math.abs(lb.tens) > 0.25 * PH.W) { const k = lb.ang / lb.lim; ring = k > 0.9 ? '#ff3b30' : k > 0.7 ? '#ffd23c' : '#fff'; } // 미끄러지기 직전 경고
      c.strokeStyle = ring; c.lineWidth = on ? 3.5 : 1.5; c.stroke();
      G.text(i % 2 ? 'R' : 'L', e.x, e.y + 4, { size: 11, weight: 900, align: 'center', color: '#111' });
      if (lb.mode === 'reach') {
        const r = p[lb.root];
        G.circle(r.x, r.y, lb.max, null, 'rgba(255,255,255,0.35)', 1.5); // 닿는 범위
        G.line(e.x, e.y, last.cx, last.cy, 'rgba(255,255,255,0.6)', 1.5, [4, 4]);
        const q = lb.arm ? PH.nearestGrip(world, e.x, e.y) : PH.nearestSurface(world, e.x, e.y), ok = q && q.d <= (lb.arm ? C.GRAB_R : C.PLANT_R);
        const steep = ok && lb.arm && q.type === 'rock' && Math.acos(Math.max(-1, Math.min(1, -q.ny))) * 180 / Math.PI > PH.GRIP.rock.th;
        if (ok) G.circle(q.x, q.y, 13 + Math.sin(S.t * 14) * 2, null, steep ? '#ff9a3d' : '#3dff8f', 3); // 초록: 지금 떼면 붙는다. 주황: 닿았지만 면이 가파르다
      }
    }
  }
  function key(c, x, label, sub, on, col) {
    G.panel(x, H - 26, 84, 21, on ? col : 'rgba(10,12,16,0.55)', on ? '#fff' : null);
    G.text(label, x + 6, H - 11, { size: 12, weight: 800, color: on ? '#111' : '#e8e8e4' });
    G.text(sub, x + 79, H - 11, { size: 10, weight: 600, align: 'right', color: on ? '#222' : 'rgba(255,255,255,0.55)' });
  }
  function draw(c) {
    c.save(); c.translate(-OX, -OY);
    drawWorld(c); drawBody(c);
    for (const f of fx) {
      if (f.kind === 'ring') G.circle(f.x, f.y, 12 + (0.4 - f.t) * 40, null, `rgba(255,255,255,${Math.min(1, f.t * 3)})`, 3);
      else { c.globalAlpha = Math.min(1, f.t * 2); const w = G.textW(f.text, 13, 800) + 14; G.panel(f.x + 14, f.y - 30, w, 22, 'rgba(120,16,16,0.9)'); G.text(f.text, f.x + 21, f.y - 14, { size: 13, weight: 800 }); c.globalAlpha = 1; }
    }
    if (jump && jump.off) { // 이륙 순간의 속도와 그 뒤 가슴이 지나간 길
      const o = jump.off; for (const q of trail) G.circle(q[0], q[1], 2, 'rgba(20,20,20,0.45)');
      const ex = o.x + o.vx * 0.14, ey = o.y + o.vy * 0.14, a = Math.atan2(o.vy, o.vx);
      G.line(o.x, o.y, ex, ey, '#111', 3); G.line(ex, ey, ex - 10 * Math.cos(a - 0.5), ey - 10 * Math.sin(a - 0.5), '#111', 3); G.line(ex, ey, ex - 10 * Math.cos(a + 0.5), ey - 10 * Math.sin(a + 0.5), '#111', 3);
      G.text(`이륙 ${Math.round(Math.hypot(o.vx, o.vy))}px/s · ${Math.round(Math.atan2(-o.vy, o.vx) * 180 / Math.PI)}°${jump.tR !== null && jump.tP !== null ? ` · 손 놓기 ${jump.tR - jump.tP >= 0 ? '+' : ''}${(jump.tR - jump.tP).toFixed(2)}초` : ''}`, o.x - 10, o.y + 22, { size: 12, weight: 800, color: '#111', align: 'right', stroke: 'rgba(255,255,255,0.7)', strokeW: 3 });
    }
    if (swing && Math.max(swing.peak, swing.cur) > 6) { // 반동 표시: 손 아래 수직선과 최근 최고 각도
      const r = 118, pk = Math.max(swing.peak, swing.cur) * Math.PI / 180;
      G.line(swing.ax, swing.ay, swing.ax, swing.ay + r, 'rgba(0,0,0,0.25)', 1.5, [3, 5]);
      for (const sg of [-1, 1]) G.line(swing.ax + Math.sin(sg * pk) * (r - 8), swing.ay + Math.cos(pk) * (r - 8), swing.ax + Math.sin(sg * pk) * (r + 8), swing.ay + Math.cos(pk) * (r + 8), '#111', 3);
      const tr = swing.prev ? (swing.peak > swing.prev + 1 ? ' ▲ 커지는 중' : swing.peak < swing.prev - 1 ? ' ▼ 줄어드는 중' : ' ─') : '';
      G.text(`반동 ${Math.round(Math.max(swing.peak, swing.cur))}°${tr}`, swing.ax, swing.ay - 14, { size: 13, weight: 800, align: 'center', color: '#111', stroke: 'rgba(255,255,255,0.7)', strokeW: 3 });
    }
    if (!S.dead) { G.line(last.cx - 9, last.cy, last.cx + 9, last.cy, '#111', 2); G.line(last.cx, last.cy - 9, last.cx, last.cy + 9, '#111', 2); G.circle(last.cx, last.cy, 5, null, '#fff', 1.5); }
    c.restore();
    G.panel(8, 6, 700, 62, 'rgba(255,255,255,0.78)');
    G.text('등반 조작 실험실', 18, 26, { size: 16, weight: 800, color: '#222' });
    G.text('누르고 있는 동안 그 손발이 커서를 따라간다 → 떼는 순간 닿은 곳을 잡는다/디딘다. 붙은 손발은 키 없이 유지된다.', 18, 44, { size: 12, color: '#333', weight: 500 });
    G.text('스페이스: 붙은 팔다리로 몸을 커서 쪽으로 당기고 민다(도약)   R 다시 · 1~5 시작 자세 · T 느리게 · J 도약 연결 · H 방향 유지', 18, 60, { size: 12, color: '#333', weight: 500 });
    G.text(bot ? bot.def.title : `${station}. ${PH.STATIONS[station].name}   시도 ${tries}${slow ? '   느리게 ×0.5' : ''}`, W - 12, 88, { size: 13, align: 'right', color: '#222', weight: 800, stroke: 'rgba(255,255,255,0.8)' });
    G.text(`${bot ? '자동 시연(사람과 같은 입력만 사용) · ' : ''}도약 연결 ${C.COUPLE ? '켬' : '끔'} · 방향 유지 ${C.AIMHOLD ? '켬' : '끔'}`, W - 12, 104, { size: 11, align: 'right', color: '#333', stroke: 'rgba(255,255,255,0.8)', strokeW: 3 });
    key(c, 10, '왼손', '좌클릭·Q', last.hand[0], COL[0]); key(c, 98, '오른손', '우클릭·E', last.hand[1], COL[1]);
    key(c, 186, '왼발', 'A', last.foot[0], COL[2]); key(c, 274, '오른발', 'D', last.foot[1], COL[3]); key(c, 362, '힘주기', 'Space', last.power, '#ffd166');
    G.text('실험 빌드 v0.3', W - 10, H - 10, { size: 11, align: 'right', color: 'rgba(255,255,255,0.6)', weight: 500 });
    if (endT > 0) G.banner('매트에 떨어짐 — 바로 다시', why && (!air || why.t >= air.t - 0.05) ? why.text : hint() ? '도약이 다음 턱에 이어지지 않았다' : air && air.gap > 0 && air.gap < 1e8 ? `손이 잡을 곳에 닿지 못했다 — 가장 가까웠을 때 ${Math.ceil(air.gap)}px 모자람` : air && air.gap <= 0 ? '손이 닿는 거리였지만 잡지 않았다(버튼을 떼야 잡는다)' : '붙잡은 곳 없이 떨어졌다', 'fail', 380);
    if (endT > 0 && hint()) { const t = hint(), w = G.textW(t, 14, 800) + 28; G.panel(W / 2 - w / 2, 458, w, 28, 'rgba(255,214,102,0.96)'); G.text(t, W / 2, 477, { size: 14, weight: 800, align: 'center', color: '#111' }); }
    else if (S.won) G.banner('목표 도달!', `${S.t.toFixed(1)}초 · 시도 ${tries} — R 또는 스페이스로 다시`, 'win', 400);
    else if (bot && bot.m.done) G.banner('건너가서 안정됨', '두 손 + 한 발로 버티는 중', 'win', 440);
  }
  G.run(game, { title: '등반 조작 실험실' });
})();
